name: Cloud Vault Archiver Worker

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Story Name (e.g. Mad Vampire Lord's Bride, A Wife's Revenge, Child of Calamity)"
        required: true
      from_start:
        description: "Start fresh from Episode 1 (delete old if any and create clean channel)"
        required: false
        default: 'false'

concurrency:
  group: vault-worker-${{ vars.WORKER_ID || github.repository }}
  cancel-in-progress: false

jobs:
  archive_and_stream:
    name: Harvest & Stream Story to Vault
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sequential Live Pipeline Engine
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          HARVESTER_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_HARVESTER }}
          VAULT_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_VAULT }}
          TELEGRAM_STRING_SESSION_HARVESTER: ${{ secrets.TELEGRAM_STRING_SESSION_HARVESTER }}
          TELEGRAM_STRING_SESSION_VAULT: ${{ secrets.TELEGRAM_STRING_SESSION_VAULT }}
          WORKER_ID: ${{ vars.WORKER_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.from_start }}" = "true" ]; then
            EXTRA_ARGS="--from_start"
          fi
          python -u cloud_archiver.py --story "${{ github.event.inputs.story }}" $EXTRA_ARGS

      - name: Auto-Commit Progress to Repository
        if: always()
        run: |
          git config --global user.name "Cloud Vault Worker ${{ vars.WORKER_ID || '1' }}"
          git config --global user.email "worker${{ vars.WORKER_ID || '1' }}@vault.ai"
          git pull origin main --rebase || true
          if [ -f "completed_vault_channels.json" ]; then
            git add completed_vault_channels.json ongoing_stories.json || true
            git commit -m "Auto-commit completed vault channel progress [skip ci]" || true
            git push origin main || true
          fi
